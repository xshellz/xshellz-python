services:
  test:
    image: python:3.12-slim
    working_dir: /work
    environment:
      PIP_CACHE_DIR: /cache/pip
      PIP_ROOT_USER_ACTION: ignore
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
      COVERAGE_FILE: /tmp/coverage/.coverage
    volumes:
      - .:/work
      - /work/.venv
      - pip-cache:/cache/pip
    command: bash -lc "mkdir -p /tmp/coverage && pip install -e '.[dev]' && ruff check . && pytest --cov=xshellz --cov-report=term-missing --cov-fail-under=80"

volumes:
  pip-cache:
